packages:
  - apps/*
  - packages/*
  - packages/agent-providers/*
# pnpm 11 reads its settings here (not from .npmrc).
autoInstallPeers: true
verifyDepsBeforeRun: false
allowBuilds:
  electron: true
  esbuild: true
  '@libsql/client': true
  libsql: true
  '@anthropic-ai/claude-agent-sdk': true
  '@openai/codex': true
  '@swc/core': true
  electron-winstaller: true
