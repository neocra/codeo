packages:
  - apps/*
  - packages/*
  - packages/agent-providers/*
# pnpm 11 reads its settings here (not from .npmrc).
autoInstallPeers: true
verifyDepsBeforeRun: false
onlyBuiltDependencies:
  - electron
  - esbuild
  - '@libsql/client'
  - libsql
  - '@anthropic-ai/claude-agent-sdk'
  - '@openai/codex'
  - '@swc/core'
