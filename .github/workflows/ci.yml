name: CI
on:
  push:
    branches: [main]
  # Pull requests run this through pr.yaml, so the PR gate "All Green / All Green" covers it.
  workflow_call:
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @codeo/runtime build
      - run: pnpm --filter @codeo/desktop exec electron-vite build
